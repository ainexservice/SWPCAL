<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AINEX SBI SWP Calculator</title>

    <meta name="description" content="Free SBI SWP Calculator by AINEX. Calculate Systematic Withdrawal Plan returns instantly.">

    <link rel="stylesheet" href="style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <main class="container">

        <!-- Header -->

        <header class="header">

            <div class="logo-box">

                <img src="assets/logo.png" alt="AINEX Logo" class="logo">

                <div>

                    <h1>AINEX SBI SWP Calculator</h1>

                    <p>Professional Systematic Withdrawal Plan Calculator</p>

                </div>

            </div>

        </header>

        <!-- Calculator -->

        <section class="calculator">

            <!-- Left Panel -->

            <aside class="left-panel">

                <!-- Investment -->

                <div class="form-group">

                    <label>Total Investment (₹)</label>

                    <div class="input-box">

                        <span class="icon">₹</span>

                        <input
                            type="text"
                            id="investmentInput"
                            value="1,000"
                            autocomplete="off">

                    </div>

                    <input
                        type="range"
                        id="investmentSlider"
                        min="1"
                        max="10000000"
                        step="1"
                        value="1000">

                    <div class="range-text">

                        <span>₹1</span>

                        <span>₹1,00,00,000</span>

                    </div>

                </div>

                <!-- Withdrawal -->

                <div class="form-group">

                    <label>Monthly Withdrawal (₹)</label>

                    <div class="input-box">

                        <span class="icon">₹</span>

                        <input
                            type="text"
                            id="withdrawInput"
                            value="500"
                            autocomplete="off">

                    </div>

                    <input
                        type="range"
                        id="withdrawSlider"
                        min="1"
                        max="5000000"
                        step="1"
                        value="500">

                    <div class="range-text">

                        <span>₹1</span>

                        <span>₹50,00,000</span>

                    </div>

                </div>

                <!-- Return -->

                <div class="form-group">

                    <label>Expected Annual Return (%)</label>

                    <div class="input-box">

                        <input
                            type="number"
                            id="returnInput"
                            value="10"
                            min="1"
                            max="20"
                            step="0.1">

                        <span class="icon">%</span>

                    </div>

                    <input
                        type="range"
                        id="returnSlider"
                        min="1"
                        max="20"
                        step="0.1"
                        value="10">

                    <div class="range-text">

                        <span>1%</span>

                        <span>20%</span>

                    </div>

                </div>

                <!-- Duration -->

                <div class="form-group">

                    <label>Duration (Years)</label>

                    <div class="input-box">

                        <input
                            type="number"
                            id="yearInput"
                            value="10"
                            min="1"
                            max="50">

                        <span class="icon">Yr</span>

                    </div>

                    <input
                        type="range"
                        id="yearSlider"
                        min="1"
                        max="50"
                        step="1"
                        value="10">

                    <div class="range-text">

                        <span>1 Year</span>

                        <span>50 Years</span>

                    </div>

                </div>

                <button id="calculateBtn">

                    <i class="fa-solid fa-calculator"></i>

                    Calculate SWP

                </button>

            </aside>

            <!-- Right Panel -->

            <section class="right-panel">

                <div class="cards">

                    <div class="card">

                        <p>Total Investment</p>

                        <h2 id="investmentResult">₹1,000</h2>

                    </div>

                    <div class="card">

                        <p>Total Withdrawal</p>

                        <h2 id="withdrawResult">₹0</h2>

                    </div>

                    <div class="card">

                        <p>Total Interest Earned</p>

                        <h2 id="interestResult">₹0</h2>

                    </div>

                    <div class="card">

                        <p>Final Corpus</p>

                        <h2 id="corpusResult">₹0</h2>

                    </div>

                </div>

                <div class="chart-card">

                    <canvas id="swpChart"></canvas>

                </div>

                <div class="status-card">

                    <span id="statusBox">
                        Ready to Calculate
                    </span>

                </div>

            </section>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="script.js"></script>

</body>

</html>
