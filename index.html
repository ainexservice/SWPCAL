<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AINEX SWP CALCULATOR</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <header class="header">

        <div class="logo-area">

            <img src="assets/logo.png" alt="AINEX Logo" class="logo">

            <div>

                <h1>AINEX SWP CALCULATOR</h1>

                <p>Professional Systematic Withdrawal Plan Calculator</p>

            </div>

        </div>

    </header>

    <!-- Calculator -->

    <section class="calculator">

        <!-- LEFT PANEL -->

        <aside class="left-panel">

            <!-- Investment -->

            <div class="form-group">

                <label>Total Investment (₹)</label>

                <div class="input-box">

                    <div class="currency-box">₹</div>

                    <input
                        type="text"
                        id="investmentInput"
                        value="1,000"
                        autocomplete="off"
                        placeholder="Enter Investment">

                </div>

                <input
                    type="range"
                    id="investmentSlider"
                    min="1"
                    max="10000000"
                    step="1"
                    value="1000">

                <div class="range-text">

                    <span>₹1</span>

                    <span>₹1,00,00,000</span>

                </div>

            </div>

            <!-- Withdrawal -->

            <div class="form-group">

                <label>Monthly Withdrawal (₹)</label>

                <div class="input-box">

                    <div class="currency-box">₹</div>

                    <input
                        type="text"
                        id="withdrawInput"
                        value="500">

                </div>

                <input
                    type="range"
                    id="withdrawSlider"
                    min="500"
                    max="500000"
                    step="500"
                    value="500">

                <div class="range-text">

                    <span>₹500</span>

                    <span>₹5,00,000</span>

                </div>

            </div>

            <!-- Return -->

            <div class="form-group">

                <label>Expected Annual Return (%)</label>

                <div class="input-box">

                    <input
                        type="number"
                        id="returnInput"
                        value="10"
                        min="1"
                        max="20"
                        step="0.1">

                    <div class="currency-box">%</div>

                </div>

                <input
                    type="range"
                    id="returnSlider"
                    min="1"
                    max="20"
                    step="0.1"
                    value="10">

                <div class="range-text">

                    <span>1%</span>

                    <span>20%</span>

                </div>

            </div>

            <!-- Duration -->

            <div class="form-group">

                <label>Duration (Years)</label>

                <div class="input-box">

                    <input
                        type="number"
                        id="yearInput"
                        value="10"
                        min="1"
                        max="50">

                    <div class="currency-box">Yr</div>

                </div>

                <input
                    type="range"
                    id="yearSlider"
                    min="1"
                    max="50"
                    step="1"
                    value="10">

                <div class="range-text">

                    <span>1 Year</span>

                    <span>50 Years</span>

                </div>

            </div>

            <button id="calculateBtn">

                <i class="fa-solid fa-calculator"></i>

                Calculate SWP

            </button>

        </aside>

        <!-- RIGHT PANEL -->

        <section class="right-panel">

            <div class="result-card">

                <h4>Total Investment</h4>

                <h2 id="investmentResult">₹1,000</h2>

            </div>

            <div class="result-card">

                <h4>Total Withdrawal</h4>

                <h2 id="withdrawResult">₹0</h2>

            </div>

            <div class="result-card">

                <h4>Total Interest Earned</h4>

                <h2 id="interestResult">₹0</h2>

            </div>

            <div class="result-card">

                <h4>Final Corpus</h4>

                <h2 id="corpusResult">₹0</h2>

            </div>

            <div class="chart-box">

                <canvas id="swpChart"></canvas>

            </div>

            <div class="status-box" id="statusBox">

                Ready to Calculate

            </div>

        </section>

    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="script.js"></script>

</body>

</html>
